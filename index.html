<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NewCar 购车工作台</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="mark">NC</div>
          <div>
            <div class="brand-title">NewCar</div>
            <div class="brand-subtitle">购车工作台</div>
          </div>
        </div>
        <nav class="nav-list" aria-label="主导航">
          <button class="nav-button active" data-view="dashboard">总览</button>
          <button class="nav-button" data-view="garage">车库</button>
          <button class="nav-button" data-view="compare">对比</button>
          <button class="nav-button" data-view="drives">试驾</button>
          <button class="nav-button" data-view="risks">风险</button>
        </nav>
        <div class="side-footer">
          <button class="ghost-button" id="exportData">导出 JSON</button>
          <label class="ghost-button file-button">
            导入 JSON
            <input id="importData" type="file" accept="application/json">
          </label>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="viewTitle">总览</h1>
            <p id="viewSubtitle">北京纯电指标，围绕舒适、续航、智能和车况风险筛车。</p>
          </div>
          <div class="topbar-actions">
            <button class="secondary-button" id="resetSeed">恢复样例</button>
            <button class="primary-button" id="addCar">新增车源</button>
          </div>
        </header>

        <section class="view active" id="dashboardView">
          <div class="metrics-grid" id="metricsGrid"></div>
          <div class="two-column">
            <section class="panel">
              <div class="panel-head">
                <h2>候选排序</h2>
                <select id="rankMode" class="select">
                  <option value="fit">综合匹配</option>
                  <option value="risk">风险最低</option>
                  <option value="value">价格折让</option>
                </select>
              </div>
              <div id="rankedCars" class="rank-list"></div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h2>近期动作</h2>
                <button class="text-button" data-view-link="risks">查看风险</button>
              </div>
              <div id="actionList" class="action-list"></div>
            </section>
          </div>
        </section>

        <section class="view" id="garageView">
          <div class="toolbar">
            <input id="searchInput" class="search" type="search" placeholder="搜索车型、商家、城市">
            <select id="stageFilter" class="select">
              <option value="all">全部阶段</option>
              <option value="watching">观察</option>
              <option value="contacted">已联系</option>
              <option value="test-drive">已试驾</option>
              <option value="negotiating">谈价</option>
              <option value="rejected">排除</option>
            </select>
            <select id="riskFilter" class="select">
              <option value="all">全部风险</option>
              <option value="low">低风险</option>
              <option value="medium">中风险</option>
              <option value="high">高风险</option>
            </select>
          </div>
          <div id="carGrid" class="car-grid"></div>
        </section>

        <section class="view" id="compareView">
          <section class="panel">
            <div class="panel-head">
              <h2>车辆对比</h2>
              <div class="muted" id="compareHint"></div>
            </div>
            <div id="compareTableWrap" class="table-wrap"></div>
          </section>
        </section>

        <section class="view" id="drivesView">
          <div class="two-column drives-layout">
            <section class="panel">
              <div class="panel-head">
                <h2>试驾记录</h2>
              </div>
              <form id="driveForm" class="stack-form">
                <label>
                  车辆
                  <select id="driveCar" class="input"></select>
                </label>
                <div class="form-grid compact">
                  <label>
                    日期
                    <input id="driveDate" class="input" type="date">
                  </label>
                  <label>
                    地点
                    <input id="drivePlace" class="input" type="text">
                  </label>
                </div>
                <div class="score-grid">
                  <label>前排座椅<input id="scoreSeat" type="range" min="1" max="10" value="8"></label>
                  <label>静谧性<input id="scoreNvh" type="range" min="1" max="10" value="8"></label>
                  <label>底盘<input id="scoreChassis" type="range" min="1" max="10" value="8"></label>
                  <label>车机<input id="scoreCockpit" type="range" min="1" max="10" value="8"></label>
                  <label>智驾<input id="scoreAdas" type="range" min="1" max="10" value="8"></label>
                  <label>停车便利<input id="scoreParking" type="range" min="1" max="10" value="8"></label>
                </div>
                <label>
                  记录
                  <textarea id="driveNotes" class="input" rows="5"></textarea>
                </label>
                <button class="primary-button" type="submit">保存试驾</button>
              </form>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h2>试驾结论</h2>
              </div>
              <div id="driveList" class="drive-list"></div>
            </section>
          </div>
        </section>

        <section class="view" id="risksView">
          <div class="two-column risks-layout">
            <section class="panel">
              <div class="panel-head">
                <h2>风险雷达</h2>
                <select id="riskCarSelect" class="select"></select>
              </div>
              <div id="riskDetail"></div>
            </section>
            <section class="panel">
              <div class="panel-head">
                <h2>核验清单</h2>
              </div>
              <div id="checklist"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <dialog id="carDialog" class="dialog">
      <form id="carForm" method="dialog" class="dialog-body">
        <div class="dialog-head">
          <div>
            <h2 id="dialogTitle">新增车源</h2>
            <p class="muted">字段越完整，风险提示越准。</p>
          </div>
          <button type="button" class="icon-button" id="closeDialog" aria-label="关闭">×</button>
        </div>
        <input type="hidden" id="carId">
        <div class="form-grid">
          <label>车型名称<input id="carName" class="input" required></label>
          <label>版本配置<input id="carTrim" class="input"></label>
          <label>阶段
            <select id="carStage" class="input">
              <option value="watching">观察</option>
              <option value="contacted">已联系</option>
              <option value="test-drive">已试驾</option>
              <option value="negotiating">谈价</option>
              <option value="rejected">排除</option>
            </select>
          </label>
          <label>车源 URL<input id="carUrl" class="input" type="url"></label>
          <label>售价/万元<input id="carPrice" class="input" type="number" step="0.01"></label>
          <label>新车同配置/万元<input id="carNewPrice" class="input" type="number" step="0.01"></label>
          <label>落地估算/万元<input id="carLanding" class="input" type="number" step="0.01"></label>
          <label>电池
            <select id="carBattery" class="input">
              <option value="buyout">买断</option>
              <option value="baas">租电/BaaS</option>
              <option value="unknown">待确认</option>
            </select>
          </label>
          <label>月租/元<input id="carBatteryMonthly" class="input" type="number" step="1"></label>
          <label>电池容量/kWh<input id="carBatterySize" class="input" type="number" step="1"></label>
          <label>CLTC/km<input id="carRange" class="input" type="number" step="1"></label>
          <label>里程/万公里<input id="carMileage" class="input" type="number" step="0.01"></label>
          <label>上牌年月<input id="carPlateDate" class="input" placeholder="2026-05"></label>
          <label>过户次数<input id="carTransfers" class="input" type="number" step="1"></label>
          <label>城市<input id="carCity" class="input"></label>
          <label>车源类型<input id="carSource" class="input" placeholder="懂车帝自营/个人/车商"></label>
          <label>商家<input id="carSeller" class="input"></label>
          <label>外观<input id="carExterior" class="input"></label>
          <label>内饰<input id="carInterior" class="input"></label>
          <label>NOP/智驾权益
            <select id="carNop" class="input">
              <option value="unknown">待确认</option>
              <option value="included">确认随车</option>
              <option value="not-included">不随车</option>
              <option value="subscription">需订阅</option>
            </select>
          </label>
          <label>检测报告
            <select id="carReport" class="input">
              <option value="basic">基础检测</option>
              <option value="full">完整第三方检测</option>
              <option value="none">暂无</option>
            </select>
          </label>
          <label>图片 URL<input id="carImage" class="input" type="url"></label>
        </div>
        <label>选装/亮点<textarea id="carOptions" class="input" rows="3"></textarea></label>
        <label>已知问题<textarea id="carIssues" class="input" rows="3"></textarea></label>
        <label>备注<textarea id="carNotes" class="input" rows="4"></textarea></label>
        <div class="dialog-actions">
          <button type="button" class="danger-button" id="deleteCar">删除</button>
          <button type="button" class="secondary-button" id="cancelCar">取消</button>
          <button class="primary-button" value="default">保存</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
